<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная — Авторизация</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151a24;
            --accent-color: #00ff66;
            --text-main: #ffffff;
            --text-muted: #7d8ba1;
            --button-bg: #248046;
            --button-hover: #1a6535;
            --input-bg: #1e2530;
            --input-border: #2d3848;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Фоновые декоративные элементы (эффект свечения) */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(0, 255, 102, 0.1) 0%, rgba(0,0,0,0) 70%);
            top: -50px;
            right: -50px;
            z-index: 0;
        }

        .login-card {
            background-color: var(--card-bg);
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        /* Блок статуса Онлайн */
        .online-status-container {
            display: inline-flex;
            align-items: center;
            background: rgba(0, 255, 102, 0.07);
            border: 1px solid rgba(0, 255, 102, 0.2);
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 25px;
        }

        .online-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-color);
            border-radius: 50%;
            margin-right: 8px;
            position: relative;
            box-shadow: 0 0 8px var(--accent-color);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 102, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(0, 255, 102, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 102, 0); }
        }

        .online-text {
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-color);
            letter-spacing: 0.5px;
        }

        .online-count {
            color: var(--text-main);
            margin-left: 4px;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Поля ввода формы */
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 15px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #5865f2;
            box-shadow: 0 0 0 2px rgba(88, 101, 242, 0.2);
        }

        /* Кнопка отправки */
        .login-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--button-bg);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .login-btn:hover {
            background-color: var(--button-hover);
        }

        .footer-links {
            margin-top: 20px;
            font-size: 13px;
        }

        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Блок Онлайна -->
        <div class="online-status-container">
            <span class="online-dot"></span>
            <span class="online-text">В СЕТИ: <span id="onlineCounter" class="online-count">1,438</span></span>
        </div>

        <h2>Войти в аккаунт</h2>
        <p class="subtitle">Получите доступ к панели управления</p>

        <form action="stats.html" method="POST">
            <div class="input-group">
                <label for="username">Логин или Email</label>
                <input type="text" id="username" name="username" required placeholder="Введите ваш логин">
            </div>
            
            <div class="input-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required placeholder="Введите ваш пароль">
            </div>

            <button type="submit" class="login-btn">Войти</button>
        </form>

        <div class="footer-links">
            <a href="#">Забыли пароль?</a>
        </div>
    </div>

    <!-- Скрипт для создания живого изменения цифр онлайна -->
    <script>
        const counterElement = document.getElementById('onlineCounter');
        let currentOnline = 1438;

        setInterval(() => {
            // Реалистичное колебание онлайна (+- от 1 до 5 человек)
            const change = Math.floor(Math.random() * 11) - 5;
            currentOnline += change;
            
            // Форматирование числа с запятыми (например, 1,435)
            counterElement.textContent = currentOnline.toLocaleString('en-US');
        }, 3000); // Обновление каждые 3 секунды
    </script>

</body>
</html>
