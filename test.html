<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Тест</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
<a href="index.html">Главная</a>
<a href="demo.html">Демонстрация</a>
<a href="protect.html">Защита</a>
<a href="test.html" class="active">Тест</a>
<a href="stats.html">Статистика</a>
<a href="project.html">Проект</a>
</nav>

<div class="container">

<div class="card">
<h2>Тест</h2>
<div id="quiz"></div>
<button onclick="check()">Проверить</button>
<p id="score"></p>
</div>

</div>

<script>

const bank = [
{t:"Банк просит пароль", o:["Игнор","Ввести"], c:0},
{t:"SMS с выигрышем", o:["Фишинг","Ок"], c:0},
{t:"URL проверка", o:["Важно","Нет"], c:0},
{t:"Срочность в письме", o:["Фишинг","Норма"], c:0},
{t:"faceb00k", o:["Подделка","Оригинал"], c:0},
{t:"HTTPS", o:["Безопасно","Реклама"], c:0},
{t:"Левые ссылки", o:["Опасно","Ок"], c:0},
{t:"Пароль просят", o:["Фишинг","Норма"], c:0},
{t:"Файлы от незнакомца", o:["Не открывать","Открыть"], c:0},
{t:"Wi-Fi public", o:["Опасно","Ок"], c:0}
];

function rand(a){return a.sort(()=>Math.random()-0.5)}

let q = rand(bank).slice(0,5);

function render(){
let quiz = document.getElementById("quiz");

q.forEach((x,i)=>{
let opts = rand([
{t:x.o[0], c:x.c==0},
{t:x.o[1], c:x.c==1}
]);

quiz.innerHTML += `<div class="question"><p>${x.t}</p>` +
opts.map(o=>`
<label class="option">
<span>${o.t}</span>
<input type="radio" name="q${i}" value="${o.c?1:0}">
<span class="box"></span>
</label>
`).join("") + "</div>";
});
}

function check(){
let score=0;

q.forEach((_,i)=>{
let opts=document.getElementsByName("q"+i);
for(let o of opts){
if(o.checked && o.value=="1") score++;
}
});

let percent=Math.round(score/q.length*100);

document.getElementById("score").innerText="Результат: "+percent+"%";

let r = JSON.parse(localStorage.getItem("results")||"[]");
r.push({percent,date:new Date().toLocaleString()});
localStorage.setItem("results",JSON.stringify(r));
}

render();

</script>

</body>
</html>
