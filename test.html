<div class="container">

<div class="card">
<h2>Тест</h2>
<div id="quiz"></div>
<button onclick="check()">Проверить</button>
<p id="res"></p>
</div>

</div>

<script>

const bank = [
{q:"Банк просит пароль", a:["Ввести","Игнор"], c:1},
{q:"SMS с выигрышем", a:["Фишинг","Доверять"], c:0},
{q:"Подозрительная ссылка", a:["Открыть","Удалить"], c:1},
{q:"HTTPS сайт", a:["Безопасно","Фейк"], c:0},
{q:"faceb00k.com", a:["Подделка","Оригинал"], c:0}
];

function shuffle(a){return a.sort(()=>Math.random()-0.5)}

let quiz = shuffle([...bank]).slice(0,5);

function render(){

let box = document.getElementById("quiz");

quiz.forEach((q,i)=>{

let opts = shuffle([
{t:q.a[0], v:q.c==0?1:0},
{t:q.a[1], v:q.c==1?1:0}
]);

box.innerHTML += `
<div class="card">
<p>${q.q}</p>

${opts.map(o=>`
<label>
<input type="radio" name="q${i}" value="${o.v}">
${o.t}
</label>
`).join("")}

</div>
`;
});
}

function check(){

let score=0;

quiz.forEach((_,i)=>{
let ans = document.getElementsByName("q"+i);
for(let a of ans){
if(a.checked && a.value=="1") score++;
}
});

let percent = Math.round(score/quiz.length*100);

document.getElementById("res").innerText =
"Результат: " + percent + "%";

// 🔥 ONLINE SAVE
db.collection("results").add({
    percent: percent,
    date: new Date().toLocaleString()
});

}

render();

</script>
