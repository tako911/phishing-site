<div class="container">

<div class="card">
<h2>Статистика</h2>

<div id="avg"></div>

<div class="bar">
<div id="fill"></div>
</div>

<div id="list"></div>

</div>

</div>

<script>

let r = JSON.parse(localStorage.getItem("results")||"[]");

let sum=0;
let list=document.getElementById("list");

r.forEach(x=>{
sum+=x.percent;
list.innerHTML+=`<div class="card">${x.percent}% - ${x.date}</div>`;
});

let avg = r.length? Math.round(sum/r.length):0;

document.getElementById("avg").innerText="Средний результат: "+avg+"%";
document.getElementById("fill").style.width=avg+"%";

</script>

</body>
