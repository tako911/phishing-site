<div class="container">

<div class="card">
<h2>📊 Онлайн статистика</h2>

<div id="avg"></div>
<div id="list"></div>

</div>

</div>

<script>

db.collection("results").get().then(snapshot => {

let sum = 0;
let count = 0;

snapshot.forEach(doc => {
let d = doc.data();

sum += d.percent;
count++;

document.getElementById("list").innerHTML += `
<div class="card">
📊 ${d.percent}%<br>
🕒 ${d.date}
</div>`;
});

let avg = count ? Math.round(sum / count) : 0;

document.getElementById("avg").innerText =
"Средний результат: " + avg + "%";

});

</script>

</body>
